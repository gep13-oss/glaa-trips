# Build, test and deploy aalg-trips to Azure App Service.
#
# Auth is secretless (OIDC): the deploy job requests a short-lived token via a
# federated credential on an Azure identity, so no publish profile or client
# secret is stored in GitHub. See the "Deploying to Azure" section of README.md
# for the one-time Azure setup (resources, app settings, and the three repo
# secrets referenced below).
#
# Placeholders to set for your environment:
#   env.AZURE_WEBAPP_NAME  - the App Service name
#   secrets.AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID - the
#     federated identity used by azure/login.

name: Build and deploy aalg-trips

on:
  push:
    branches:
      - main
  # Run the build/test job on PRs too (e.g. Dependabot updates) so a bad bump is
  # caught before merge. The deploy job below is gated to non-PR events, so a PR
  # never deploys.
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: aalg-trips
  DOTNET_VERSION: "10.0.x"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build AalgTrips.slnx -c Release

      # The UI tests drive a real browser, so install Chromium (with its OS
      # dependencies) before running them. The playwright.ps1 script is produced
      # when the UITests project is built (step above).
      - name: Install Playwright (Chromium + OS deps)
        run: pwsh tests/AalgTrips.UITests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Runs the format gate, unit tests and the Playwright UI tests, matching
      # the local gate. (The Azure Blob store tests stay skipped without a
      # connection string; the local disk store covers the same contract.)
      - name: Format check, build and test
        run: dotnet cake.cs --target=Test

      - name: Publish
        run: dotnet publish src/AalgTrips/AalgTrips.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Upload published app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: ${{ github.workspace }}/publish

  deploy:
    needs: build-test
    # Only deploy on a push to main (or a manual run) — never for a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # required for the OIDC token
      contents: read
    steps:
      - name: Download published app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: ./publish

      # Defence in depth: a build/publish/artifact problem should fail the deploy,
      # not silently ship an app with no entry assembly. Refuse to deploy unless
      # the published entry DLL is present.
      - name: Verify the published app is present
        run: |
          if [ ! -f ./publish/AalgTrips.dll ]; then
            echo "::error::Published app missing (AalgTrips.dll not found in ./publish) — refusing to deploy."
            exit 1
          fi
          echo "Verified $(find ./publish -type f | wc -l) files; AalgTrips.dll present."

      - name: Sign in to Azure (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # clean: true wipes wwwroot before deploying so a rename or removal can't
      # leave a stale file behind (the Phase 2 outage came from an old
      # GlaaTrips.dll lingering next to AalgTrips.dll after an overlay deploy).
      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
          clean: true
